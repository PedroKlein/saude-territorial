# Production stack: standalone Next.js image with native Postgres.
# Usage: BETTER_AUTH_SECRET=... BETTER_AUTH_URL=https://example.com docker compose -f docker-compose.prod.yml up --build
name: saude-territorial-prod

services:
  db:
    image: postgres:16-alpine
    container_name: saude-territorial-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saude
      POSTGRES_PASSWORD: saude
      POSTGRES_DB: saude_territorial
    volumes:
      - saude-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saude -d saude_territorial"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: saude-territorial-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://saude:saude@db:5432/saude_territorial
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      GOOGLE_SA_KEY_FILE: /app/.secret/sa_key.json
    volumes:
      - ${GOOGLE_SA_KEY_FILE:-./.secret/sa_key.json}:/app/.secret/sa_key.json:ro
      - saude-prod-backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  nominatim:
    image: mediagis/nominatim:5.3
    container_name: saude-territorial-prod-nominatim
    restart: unless-stopped
    environment:
      PBF_PATH: /nominatim/data/porto-alegre.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    volumes:
      - nominatim-prod-data:/var/lib/postgresql/16/main
      - ./services/nominatim:/nominatim/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30m

volumes:
  saude-prod-pgdata:
  saude-prod-backups:
  nominatim-prod-data:
