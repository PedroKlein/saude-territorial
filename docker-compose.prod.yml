# Production compose: built app image + Postgres.
# Usage: docker compose -f docker-compose.prod.yml up --build
name: saude-territorial-prod

services:
  db:
    image: postgres:16-alpine
    container_name: saude-territorial-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saude
      POSTGRES_PASSWORD: saude
      POSTGRES_DB: saude_territorial
    volumes:
      - saude-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saude -d saude_territorial"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .  # Multi-stage build defined in ./Dockerfile
    container_name: saude-territorial-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://saude:saude@db:5432/saude_territorial
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      AUTH_DB_PATH: /app/data/auth.db
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  saude-prod-pgdata:
