# Optional Postgres parity database. Local development defaults to PGlite;
# production uses any Postgres server through DATABASE_URL.
#
# Usage is wrapped by mise tasks: `mise run db:postgres:up`,
# `db:postgres:down`, and `db:postgres:reset`.
#
# `name:` pins the Compose project so it never collides with other repos that
# also live in a `main/` worktree dir (Compose otherwise derives the project
# name from the directory, which is `main` for every worktree).
name: saude-territorial
services:
  db:
    image: postgres:16-alpine
    container_name: saude-territorial-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saude
      POSTGRES_PASSWORD: saude
      POSTGRES_DB: saude_territorial
    ports:
      # Host port is overridable: if 5432 is already taken (another local
      # Postgres, etc.), set DB_PORT in a local `.env` file and change the
      # port in your `.env.local` DATABASE_URL to match.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - saude-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saude -d saude_territorial"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  saude-pgdata:
