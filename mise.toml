[tools]
node = "25"

[env]
_.path = ["./node_modules/.bin"]

[tasks."dev:auth"]
description = "Generate auth state for agent_browser testing (requires dev server running)"
run = "node scripts/dev-auth-state.mjs"

[tasks.dev]
description = "Start Next.js dev server with Turbopack"
run = "pnpm dev"

[tasks.build]
description = "Build production bundle"
depends = ["type-check", "lint"]
run = "next build"

[tasks.start]
description = "Start production server"
run = "next start"

[tasks.test]
description = "Run Vitest test suite"
run = "vitest run"

[tasks."test:watch"]
description = "Run Vitest in watch mode"
run = "vitest"

[tasks."test:coverage"]
description = "Run tests with coverage report"
run = "vitest run --coverage"

[tasks.lint]
description = "Run ESLint on src/"
run = "eslint src/"

[tasks."lint:fix"]
description = "Run ESLint with auto-fix"
run = "eslint src/ --fix"

[tasks.type-check]
description = "TypeScript compilation check (no emit)"
run = "tsc --noEmit"

[tasks.check]
description = "Run all quality gates: type-check + lint + test"
depends = ["type-check", "lint", "test"]

[tasks."db:postgres:up"]
description = "Start the optional Docker Postgres parity database"
run = "docker compose up -d --wait"

[tasks."db:postgres:down"]
description = "Stop the optional Docker Postgres parity database"
run = "docker compose down"

[tasks."db:postgres:reset"]
description = "Wipe and rebuild the optional Docker Postgres parity database"
run = """
docker compose down -v
docker compose up -d --wait
url="postgresql://saude:saude@localhost:${DB_PORT:-5432}/saude_territorial"
DATABASE_DRIVER=postgres DATABASE_URL="$url" pnpm db:migrate
DATABASE_DRIVER=postgres DATABASE_URL="$url" pnpm db:seed
"""

[tasks."db:migrate"]
description = "Apply Drizzle migrations to local PGlite or selected Postgres"
run = "pnpm db:migrate"

[tasks."db:seed"]
description = "Load synthetic patient data (seed/) into the database"
run = "pnpm db:seed"

[tasks."db:seed:user"]
description = "Create the configured local development login"
run = "pnpm db:seed:user"

[tasks."db:studio"]
description = "Open Drizzle Studio against the database"
run = "pnpm db:studio"

[tasks."db:reset"]
description = "Wipe and rebuild the local PGlite database"
run = "pnpm db:reset"

[tasks.setup]
description = "One-command local setup: install, migrate, seed synthetic data, create dev user"
run = """
pnpm install
[ -f .env.local ] || cp .env.local.example .env.local
pnpm db:migrate
pnpm db:seed
pnpm db:seed:user
echo ""
echo "Setup complete."
echo "  Start the app:  mise run dev"
echo "  Log in at http://localhost:3000/login with the configured development account."
"""

[tasks.install]
description = "Install dependencies with pnpm"
run = "pnpm install"

[tasks.clean]
description = "Remove build artifacts and caches"
run = "rm -rf .next node_modules/.cache coverage"
