[tools]
node = "25"

[env]
_.path = ["./node_modules/.bin"]

[tasks."dev:auth"]
description = "Generate auth state for agent_browser testing (requires dev server running)"
run = "node scripts/dev-auth-state.mjs"

[tasks.dev]
description = "Start Next.js dev server with Turbopack"
run = "next dev --turbopack"

[tasks.build]
description = "Build production bundle"
depends = ["type-check", "lint"]
run = "next build"

[tasks.start]
description = "Start production server"
run = "next start"

[tasks.test]
description = "Run Vitest test suite"
run = "vitest run"

[tasks."test:watch"]
description = "Run Vitest in watch mode"
run = "vitest"

[tasks."test:coverage"]
description = "Run tests with coverage report"
run = "vitest run --coverage"

[tasks.lint]
description = "Run ESLint on src/"
run = "eslint src/"

[tasks."lint:fix"]
description = "Run ESLint with auto-fix"
run = "eslint src/ --fix"

[tasks.type-check]
description = "TypeScript compilation check (no emit)"
run = "tsc --noEmit"

[tasks.check]
description = "Run all quality gates: type-check + lint + test"
depends = ["type-check", "lint", "test"]

[tasks."db:up"]
description = "Start the local Postgres (docker compose) and wait until healthy"
run = """
# Only start the local docker Postgres when DATABASE_URL points at localhost.
# A remote DATABASE_URL (managed/hosted Postgres) needs no local container, and
# starting one would just collide with whatever else owns the host port.
url="$(sed -n 's/^DATABASE_URL=//p' .env.local 2>/dev/null | head -1)"
case "$url" in
  ""|*@localhost:*|*@127.0.0.1:*)
    docker compose up -d --wait ;;
  *)
    echo "DATABASE_URL is not local, so skipping the docker Postgres:"
    echo "  $url"
    echo "Migrations and the app will use that DATABASE_URL directly." ;;
esac
"""

[tasks."db:down"]
description = "Stop the local Postgres container (keeps data volume)"
run = "docker compose down"

[tasks."db:auth-migrate"]
description = "Create Better Auth tables in the local SQLite store (auth.db)"
run = "echo y | npx @better-auth/cli migrate"

[tasks."db:migrate"]
description = "Apply Drizzle SQL migrations to the database (DATABASE_URL)"
run = "pnpm db:migrate"

[tasks."db:seed"]
description = "Load synthetic patient data (seed/) into the database"
run = "pnpm db:seed"

[tasks."db:seed:user"]
description = "Create the local dev login (dev@local / dev12345)"
run = "pnpm db:seed:user"

[tasks."db:studio"]
description = "Open Drizzle Studio against the database"
run = "pnpm db:studio"

[tasks."db:reset"]
description = "Wipe and rebuild the local database (drops the docker volume)"
run = """
docker compose down -v
docker compose up -d --wait
pnpm db:migrate
pnpm db:seed
"""

[tasks.setup]
description = "One-command local setup: install, DB, migrations, synthetic data, dev user"
run = """
pnpm install
[ -f .env.local ] || cp .env.local.example .env.local
mise run db:up
echo y | npx @better-auth/cli migrate
pnpm db:migrate
pnpm db:seed
pnpm db:seed:user
echo ""
echo "Setup complete."
echo "  Start the app:  mise run dev"
echo "  Log in at http://localhost:3000/login  →  dev@local.dev / dev12345"
"""

[tasks.install]
description = "Install dependencies with pnpm"
run = "pnpm install"

[tasks.clean]
description = "Remove build artifacts and caches"
run = "rm -rf .next node_modules/.cache coverage"
