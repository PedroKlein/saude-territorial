# Full development stack: hot-reloading Next.js app with native Postgres.
# Local development without Docker continues to use PGlite by default.
# Usage: docker compose -f docker-compose.dev.yml up
name: saude-territorial-dev

services:
  db-dev:
    image: postgres:16-alpine
    container_name: saude-territorial-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saude
      POSTGRES_PASSWORD: saude
      POSTGRES_DB: saude_territorial
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - saude-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saude -d saude_territorial"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: node:22-alpine
    container_name: saude-territorial-dev-app
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec drizzle-kit migrate && pnpm db:seed:user && pnpm dev"
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://saude:saude@db-dev:5432/saude_territorial
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      BETTER_AUTH_URL: http://localhost:${APP_PORT:-3000}
      NEXT_PUBLIC_APP_URL: http://localhost:${APP_PORT:-3000}
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - ${GOOGLE_SA_KEY_FILE:-./.secret/sa_key.json}:/app/.secret/sa_key.json:ro
    depends_on:
      db-dev:
        condition: service_healthy

  nominatim:
    image: mediagis/nominatim:5.3
    container_name: saude-territorial-dev-nominatim
    restart: unless-stopped
    environment:
      PBF_PATH: /nominatim/data/porto-alegre.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    ports:
      - "${NOMINATIM_PORT:-3002}:8080"
    volumes:
      - nominatim-dev-data:/var/lib/postgresql/16/main
      - ./services/nominatim:/nominatim/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30m

volumes:
  saude-dev-pgdata:
  dev-node-modules:
  nominatim-dev-data:
