name: CodeQL

# Disabled: code scanning on a private repo needs GitHub Code Security (paid),
# so every run failed. Manual trigger only until the repo goes public; then
# restore the triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   # Weekly scan catches newly published vulnerability patterns without a code change.
  #   - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          # Covers JS and TS in one pass; no build step needed for these languages.
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
