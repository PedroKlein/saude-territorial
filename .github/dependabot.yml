version: 2

updates:
  # Application dependencies (pnpm; dependabot reads pnpm-lock.yaml under the npm ecosystem).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Monthly keeps the PR queue small for a team that reviews part-time.
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Batch routine bumps into one PR to keep review load sane; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the versions pinned in .github/workflows/*.yml fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # Action bumps rarely interact; one PR for all of them instead of one each.
      github-actions:
        patterns:
          - "*"
